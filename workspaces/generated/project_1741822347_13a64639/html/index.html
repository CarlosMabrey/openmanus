<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Welcome to My Photography Portfolio</h1>
        <section id="gallery">
            <h2>Gallery Showcase</h2>
            <!-- Add your gallery images here -->
            <div class="gallery-grid">
                <img src="images/photo1.jpg" alt="Photo 1">
                <img src="images/photo2.jpg" alt="Photo 2">
                <img src="images/photo3.jpg" alt="Photo 3">
                <!-- Add more images as needed -->
            </div>
        </section>
        <section id="instagram-feed">
            <h2>Latest Instagram Posts</h2>
            <!-- Instagram feed will be populated here -->
            <div id="instagram-container"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Photography Portfolio. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instafeed.js@1.4.1/dist/instafeed.min.js"></script>
    <script>
        var feed = new Instafeed({
            accessToken: 'YOUR_INSTAGRAM_ACCESS_TOKEN',
            target: 'instagram-container',
            template: '<a href="{{link}}" target="_blank"><img src="{{image}}" alt="{{caption}}"></a>',
            limit: 6
        });
        feed.run();
    </script>
</body>
</html>
