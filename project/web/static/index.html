<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenManus</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar for the output area */
        #output::-webkit-scrollbar {
            width: 8px;
        }
        
        #output::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        #output::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 4px;
        }
        
        #output::-webkit-scrollbar-thumb:hover {
            background-color: #64748b;
        }

        /* Animation for loading */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <svg class="h-10 w-10 text-primary-600" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 6.75V15M15 9V17.25M16.5 19.5H21.75V4.5H2.25V19.5H7.5M12 4.5V19.5M16.5 19.5C16.5 21.1569 14.6569 22.5 12 22.5C9.34315 22.5 7.5 21.1569 7.5 19.5M16.5 19.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1 class="text-3xl font-bold text-slate-800">OpenManus</h1>
                </div>
                <div class="text-sm text-slate-500">
                    Versatile AI Agent Platform
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Left Panel - Configuration -->
            <div class="w-full lg:w-1/3 bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-xl font-semibold text-slate-800 mb-6 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-primary-500" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.3246 4.31731C10.751 2.5609 13.249 2.5609 13.6754 4.31731C13.9508 5.45193 15.2507 5.99038 16.2478 5.38285C17.7913 4.44239 19.5576 6.2087 18.6172 7.75218C18.0096 8.74925 18.5481 10.0492 19.6827 10.3246C21.4391 10.751 21.4391 13.249 19.6827 13.6754C18.5481 13.9508 18.0096 15.2507 18.6172 16.2478C19.5576 17.7913 17.7913 19.5576 16.2478 18.6172C15.2507 18.0096 13.9508 18.5481 13.6754 19.6827C13.249 21.4391 10.751 21.4391 10.3246 19.6827C10.0492 18.5481 8.74926 18.0096 7.75219 18.6172C6.2087 19.5576 4.44239 17.7913 5.38285 16.2478C5.99038 15.2507 5.45193 13.9508 4.31731 13.6754C2.5609 13.249 2.5609 10.751 4.31731 10.3246C5.45193 10.0492 5.99037 8.74926 5.38285 7.75218C4.44239 6.2087 6.2087 4.44239 7.75219 5.38285C8.74926 5.99037 10.0492 5.45193 10.3246 4.31731Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Model Configuration
                </h2>

                <div class="space-y-5">
                    <!-- Deployment Type -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2" for="deployType">
                            Deployment Type
                        </label>
                        <select id="deployType" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                            <option value="local">Local Deployment</option>
                            <option value="cloud">Cloud Model</option>
                        </select>
                    </div>

                    <!-- Local Models -->
                    <div id="localModels">
                        <label class="block text-sm font-medium text-slate-700 mb-2" for="localModelSelect">
                            Available Local Models
                        </label>
                        <select id="localModelSelect" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                            <option value="qwen2.5:14b">Qwen 2.5 (14B)</option>
                            <option value="deepseek-r1:7b">DeepSeek R1 (7B)</option>
                            <option value="qwq:latest">QWQ (32B)</option>
                        </select>
                    </div>

                    <!-- Cloud Models -->
                    <div id="cloudConfig" class="hidden space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2" for="cloudModelSelect">
                                Cloud Models
                            </label>
                            <select id="cloudModelSelect" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                                <option value="gpt-4o-mini">GPT-4o Mini</option>
                                <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2" for="apiKey">
                                API Key
                            </label>
                            <input type="password" id="apiKey" placeholder="Enter your API key" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                        </div>
                    </div>

                    <!-- Prompt Input -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2" for="input">
                            Your Request
                        </label>
                        <textarea id="input" rows="6" placeholder="Describe what you want OpenManus to do..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition resize-none"></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-3 pt-2">
                        <button id="executeBtn" onclick="executePrompt()" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white font-medium py-2 px-4 rounded-lg transition flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Execute
                        </button>
                        <button id="stopBtn" onclick="stopExecution()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 18L18 6M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Stop
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Output -->
            <div class="w-full lg:w-2/3 bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-xl font-semibold text-slate-800 mb-6 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-primary-500" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 8V12L15 15M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Execution Log
                </h2>
                <div id="output" class="h-[calc(100vh-16rem)] bg-slate-900 text-slate-200 rounded-lg p-4 font-mono text-sm overflow-y-auto">
                    <div class="text-slate-400">OpenManus is ready. Configure your model and enter your request to begin.</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-8 text-center text-slate-500 text-sm">
            <p>OpenManus &copy; 2023-2024 | An open-source AI agent platform</p>
        </footer>
    </div>

    <script>
        // Dynamic display of configuration areas
        document.getElementById('deployType').addEventListener('change', function(e) {
            const cloudConfig = document.getElementById('cloudConfig');
            const localModels = document.getElementById('localModels');
            if (e.target.value === 'cloud') {
                cloudConfig.classList.remove('hidden');
                localModels.classList.add('hidden');
            } else {
                cloudConfig.classList.add('hidden');
                localModels.classList.remove('hidden');
            }
        });
    </script>
    <script src="js/frontend.js"></script>
</body>
</html>
